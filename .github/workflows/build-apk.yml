name: Build HireKoro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare google-services.json
        run: |
          mkdir -p app/src/debug app/src/main android/app/src/debug android/app/src/main
          DUMMY_JSON='{"project_info":{"project_number":"123456789","project_id":"hirekoro-dummy","storage_bucket":"hirekoro-dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.aistudio.hirekoro.bvqwmz"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef123","android_client_info":{"package_name":"com.hirekoro.app"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
          if [ ! -f "app/google-services.json" ]; then echo "$DUMMY_JSON" > app/google-services.json; fi
          cp app/google-services.json app/src/debug/google-services.json || true
          cp app/google-services.json app/src/google-services.json || true
          cp app/google-services.json android/app/google-services.json || true
          cp app/google-services.json android/app/src/debug/google-services.json || true
          cp app/google-services.json android/app/src/google-services.json || true
          echo "Verified google-services.json across directories:"
          ls -la app/google-services.json app/src/debug/google-services.json android/app/google-services.json

      - name: Prepare Debug Keystore
        run: |
          mkdir -p ~/.android android/app app
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore || true
          cp debug.keystore android/app/debug.keystore || true
          cp debug.keystore app/debug.keystore || true
          echo "Keystore verified at root:"
          ls -la debug.keystore

      - name: Build Android APK with Gradle
        run: |
          chmod +x ./gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
          mkdir -p build/app/outputs/flutter-apk
          cp app/build/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-release.apk || cp .build-outputs/app-debug.apk build/app/outputs/flutter-apk/app-release.apk
          ls -la build/app/outputs/flutter-apk/app-release.apk

      - name: Upload HireKoro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HireKoro-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
